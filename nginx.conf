# ====================================================================
# GANESHSTORE NGINX PRODUCTION SECURITY HEADERS CONFIGURATION
# ====================================================================
server {
    listen 80;
    listen 443 ssl http2;
    server_name ganeshstore.com www.ganeshstore.com;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://assets.adobedtm.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://*.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https: blob:; connect-src 'self' https://urglyumucxvnszyyrdiv.supabase.co wss://urglyumucxvnszyyrdiv.supabase.co https://*.supabase.co wss://*.supabase.co https://*.demdex.net https://*.omtrdc.net https://*.adobedc.net https://assets.adobedtm.com https://*.firebaseio.com https://*.googleapis.com https://*.firebaseapp.com; frame-src 'self' https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
